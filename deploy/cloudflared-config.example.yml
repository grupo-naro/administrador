# Copiar a ~/.cloudflared/config.yml (Linux) o %USERPROFILE%\.cloudflared\config.yml (Windows)
# y reemplazar los valores entre <>.
tunnel: <ID-DEL-TUNEL>
credentials-file: <RUTA-ABSOLUTA>/<ID-DEL-TUNEL>.json   # Linux: /etc/cloudflared/<ID>.json
ingress:
  - hostname: panel.tudominio.com
    service: http://127.0.0.1:3000
  - service: http_status:404
